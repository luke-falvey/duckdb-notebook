<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DuckDB Notebook</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<div class="nb-app" id="app">
  <div class="nb-toolbar">
    <span class="nb-title" id="title">Notebook</span>
    <span class="nb-source" id="source"></span>
    <span class="spacer"></span>
    <span class="nb-status" id="status"></span>
    <button id="run-all" class="primary" title="Run every cell in order (Ctrl+Shift+Enter)">▶ Run all</button>
    <button id="interrupt" hidden title="Interrupt the running query">■ Stop</button>
    <button id="gear" class="nb-gear" title="Options" aria-haspopup="true" aria-expanded="false">⚙</button>

    <div class="nb-menu" id="menu" role="menu">
      <h4>notebook</h4>
      <div class="row"><select id="open" class="grow" title="Open another notebook"></select></div>
      <div class="row">
        <button id="save" title="Save (Ctrl+S)">Save</button>
        <label title="Re-run query, markdown and chart cells when something they read changes"><input type="checkbox" id="autorun" checked> auto-run</label>
      </div>
      <div class="row">
        <label title="Keep each cell's last result beside the notebook, so it opens showing them without running anything (cache: in the [notebook] cell, saved with the notebook)"><input type="checkbox" id="keep-results" checked> keep results</label>
        <span class="grow"></span>
        <button id="forget-results" title="Forget the results kept for this notebook. Nothing else is lost: running it brings them back.">Forget</button>
      </div>

      <h4>view</h4>
      <div class="row">
        <button id="view-reading" title="Reading view: hide code and chrome">Reading</button>
        <button id="view-present" title="Present: one screen at a time. Arrows, Space or a click move; Esc leaves; F for full screen">Present</button>
        <button id="view-graph" title="Show the dependency graph">Graph</button>
        <button id="view-sidebar" title="Show or hide the catalog">Catalog</button>
        <button id="theme" title="Light or dark">◐</button>
      </div>
      <div class="row">rows per page
        <select id="page-size" title="Default page size for tables without rows= set"></select>
        <label title="Show how long each cell took (timing: in the [notebook] cell, saved with the notebook)"><input type="checkbox" id="show-timing" checked> timing</label>
      </div>
      <div class="row">handwriting
        <select id="ink" title="How the page is written when it appears (remembered in this browser)">
          <option value="gentle">gentle</option>
          <option value="slow">slow</option>
          <option value="off">off</option>
        </select>
        <label title="While editing a query, show the first rows of the CTE or sub-query the caret is in (remembered in this browser)"><input type="checkbox" id="peek" checked> peek</label>
      </div>

      <h4>export</h4>
      <div class="row">
        <select id="export-format" class="grow" title="Export format">
          <option value="html">HTML page</option>
          <option value="html-precomputed">HTML, inputs precomputed</option>
          <option value="pdf">PDF (print)</option>
          <option value="md">Markdown</option>
          <option value="sql">SQL script</option>
        </select>
      </div>
      <div class="row">
        <label><input type="checkbox" id="export-code" checked> code</label>
        <label><input type="checkbox" id="export-output" checked> output</label>
        <span class="grow"></span>
        <button id="export">Export</button>
      </div>
      <div class="row hint">Cells marked hide= stay hidden either way.</div>
    </div>
  </div>
  <div class="nb-toolbar-rule" id="toolbar-rule"></div>
  <div class="nb-sidebar" id="sidebar"></div>
  <div class="nb-main" id="main">
    <div id="banner"></div>
    <div id="graph"></div>
    <div class="nb-cells" id="cells"></div>
  </div>
</div>
<script src="/assets/render-sketch.js"></script>
<script src="/assets/ink-strokes.js"></script>
<script src="/assets/render-ink.js"></script>
<script src="/assets/render-core.js"></script>
<script src="/assets/render-sql.js"></script>
<script src="/assets/render-chart.js"></script>
<script src="/assets/render-typed.js"></script>
<script src="/assets/render-present.js"></script>
<script src="/assets/app.js"></script>
<script src="/assets/app-extra.js"></script>
<script src="/assets/app-peek.js"></script>
<script>App.start();</script>
</body>
</html>
