name: Documentation site
# Builds site/ with MkDocs on every pull request and publishes it to GitHub Pages on pushes to main.
# The build is strict (a broken link, anchor or included file fails it), and check_links.py also
# checks links written in raw HTML. It does not build DuckDB: the screenshots, exports and query
# outputs under site/ are committed, regenerated by site/tools/assets.py and site/tools/outputs.py.
# The notebooks the docs show are checked by test/sql/docs_notebooks.test in "Build and test".
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: site/requirements.txt
      - run: pip install -r site/requirements.txt
      - run: mkdocs build --strict -f site/mkdocs.yml
      - run: python site/tools/check_links.py build/site
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
