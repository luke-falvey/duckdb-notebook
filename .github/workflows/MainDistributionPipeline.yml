name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  # Fast feedback: the DuckDB-independent core, compiled and tested in seconds.
  core-test:
    name: Core unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -f core.Makefile core_test
      - run: make -f core.Makefile frontend_check

  # DuckDB's shared extension pipeline: builds the extension and runs test/sql.
  # Only linux_amd64 for now, to keep CI quick while the extension is young. Remove
  # exclude_archs to build every platform, which the community repository requires.
  # The three wasm targets are built (docs/DESIGN.md section 17): wasm_eh and wasm_threads are
  # what DuckDB-WASM 2.0 loads (its base and threads bundles); wasm_mvp has no 2.0 bundle to load
  # into but is built because the community repository builds it.
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      duckdb_version: v2.0.0
      ci_tools_version: v2.0-cyanoptera
      extension_name: notebook
      exclude_archs: "linux_arm64;linux_amd64_musl;linux_arm64_musl;osx_amd64;osx_arm64;windows_amd64;windows_arm64;windows_amd64_mingw"

  # The pipeline does not test wasm builds, so this loads the wasm_eh and wasm_threads artifacts
  # into DuckDB-WASM 2.0 in headless Chromium and runs the notebook functions (test/wasm).
  wasm-test:
    name: Extension in DuckDB-WASM
    needs: duckdb-stable-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: notebook-v2.0.0-extension-wasm_eh
          path: build/wasm_eh/extension/notebook
      - uses: actions/download-artifact@v4
        with:
          name: notebook-v2.0.0-extension-wasm_threads
          path: build/wasm_threads/extension/notebook
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install DuckDB-WASM and Playwright
        working-directory: test/wasm
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
      - run: node test/wasm/run.cjs wasm_eh wasm_threads
